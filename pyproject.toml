[project]
name = "battery-optimizer"
version = "1.0.0"
description = "Battery charge/discharge optimizer for Growatt WIT Inverter with Nord Pool prices"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.28.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-asyncio>=0.21.0",
    "pyyaml>=6.0.3",
    # Windows has no system tz database, so `zoneinfo.ZoneInfo("Europe/Riga")`
    # raises there and the price-horizon zone test would only ever skip on a
    # developer machine. The HA add-on runs on Linux and needs no such package.
    "tzdata>=2024.1; sys_platform == 'win32'",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.coverage.run]
source = ["appdaemon/apps"]
omit = ["tests/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]
